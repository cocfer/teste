<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lofi Snake</title>
<style>
html,body{margin:0;background:#090b11;color:#eee;font-family:system-ui,-apple-system,sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
.app{width:min(100%,520px);padding:14px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px}
.live{border:1px solid #444;border-radius:20px;padding:5px 9px;font-size:11px}
.panel{background:#121620;border:1px solid #292f3b;border-radius:16px;padding:10px}
canvas{width:100%;height:auto;aspect-ratio:1;display:block;background:#07090e;border-radius:11px}
.stats{display:flex;justify-content:space-between;margin-top:10px;font-weight:700}
button{width:100%;border:0;border-radius:11px;padding:13px;background:#eee;color:#111;font-weight:700;font-size:15px}
.small{text-align:center;color:#9da3b2;font-size:12px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>🌙 LOFI SNAKE</h1><span class="live">● LIVE</span></div>
  <div class="panel">
    <canvas id="c" width="600" height="600"></canvas>
    <div class="stats"><span>SCORE: <b id="score">0</b></span><span>BEST: <b id="best">0</b></span></div>
  </div>
  <div class="panel">
    <div class="small">🎵 lofi • chill • endless</div>
    <button id="music" style="margin-top:8px">▶ Tocar lofi</button>
  </div>
</div>
<script>
(function(){
  const c=document.getElementById('c'),x=c.getContext('2d'),N=20;
  let snake=[],food={x:12,y:10},score=0;
  let best=Number(localStorage.getItem('snakeBest')||0);
  document.getElementById('best').textContent=best;

  // A closed, safe serpentine route. The snake follows it forever.
  const route=[];
  for(let y=0;y<N;y++){
    if(y%2===0) for(let xx=0;xx<N;xx++) route.push({x:xx,y:y});
    else for(let xx=N-1;xx>=0;xx--) route.push({x:xx,y:y});
  }
  // Start in a valid segment of the route.
  snake=[{x:0,y:10},{x:1,y:10},{x:2,y:10},{x:3,y:10},{x:4,y:10},{x:5,y:10}];

  function spawn(){
    const used=new Set(snake.map(p=>p.x+','+p.y));
    const free=route.filter(p=>!used.has(p.x+','+p.y));
    food=free[Math.floor(Math.random()*free.length)];
  }
  function draw(){
    x.clearRect(0,0,N,N);
    x.fillStyle='#07090e';x.fillRect(0,0,N,N);
    x.strokeStyle='rgba(255,255,255,.035)';x.lineWidth=.025;
    for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i,0);x.lineTo(i,N);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(N,i);x.stroke();}
    x.fillStyle='#d8b15b';x.fillRect(food.x+.18,food.y+.18,.64,.64);
    snake.forEach((p,i)=>{x.fillStyle=i===snake.length-1?'#f5f5f5':'#79c58b';x.fillRect(p.x+.08,p.y+.08,.84,.84);});
  }
  function step(){
    const h=snake[snake.length-1];
    const i=route.findIndex(p=>p.x===h.x&&p.y===h.y);
    const n=route[(i+1)%route.length];
    snake.push({x:n.x,y:n.y});
    if(n.x===food.x&&n.y===food.y){
      score++; if(score>best){best=score;localStorage.setItem('snakeBest',best);}
      spawn();
    } else snake.shift();
    document.getElementById('score').textContent=score;
    document.getElementById('best').textContent=best;
    draw();
  }

  // Start immediately, including on iPhone/iPad.
  spawn(); draw();
  setInterval(step,110);
